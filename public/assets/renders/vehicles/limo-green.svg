<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title_limo_green desc_limo_green">
  <title id="title_limo_green">Limo Green demo render</title>
  <desc id="desc_limo_green">Ảnh render tự tạo cho website demo, không phải ảnh sản phẩm chính thức của VinFast.</desc>
  <defs>
